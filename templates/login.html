
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | EMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5eaff, #e6f2ff, #fce9f0);
        }

        .login-container {
            width: 400px;
            max-width: 90%;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(100, 80, 120, 0.12);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            background: #e9ddff;
            color: #7952b3;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #39334a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9991a5;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #554c65;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e5ddef;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            background: #fcfaff;
        }

        input:focus {
            border-color: #aa8bd6;
            box-shadow: 0 0 5px rgba(170, 139, 214, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #a78bce;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #8969b5;
        }

        .error {
            color: #d95370;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #aaa2b4;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">E</div>

        <h2>Welcome Back!</h2>

        <p class="subtitle">
            Login to your Employee Management System
        </p>

        {% if form.errors %}
            <p class="error">
                Invalid username or password. Please try again.
            </p>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="footer">
            Employee Management System © 2026
        </div>

    </div>

</body>
</html>
